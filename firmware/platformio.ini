; PlatformIO Project Configuration File for TerraFlow ESP32-S3 AWLR
; PT Tanah Airku Teknologi

[env:esp32-s3-devkitc-1]
;Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4.7).
; Core 2.x dipilih karena ESPAsyncWebServer pada core 3.x membutuhkan library
; "Network" terpisah yang tidak dapat dipetakan Library Dependency Finder
; PlatformIO (folder "Network" tetapi library.properties menuliskan
; name=Networking tanpa declares includes), sehingga build gagal dengan
; "fatal error: Network.h: No such file or directory".
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

build_src_filter = +<*> -<../tools/*>

; Peringatan bila kredensial broker MQTT belum disiapkan (src/config_secrets.h)
extra_scripts = pre:scripts/build_check.py

lib_ldf_mode = deep+

lib_deps = 
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    ; Fork ESPHome dari AsyncTCP - mendukung Arduino core 2.x maupun 3.x
    esphome/AsyncTCP-esphome @ ^2.1.4
    ; ESPAsyncWebServer v2.9.1 (commit 2d2da07) - versi terakhir yang
    ; memakai API beginResponse() dan masih mendukung core 2.x.
    ; Repo sudah dipindah ke ESP32Async/ESPAsyncWebServer tanpa tag lama,
    ; jadi versi ini di-pin lewat commit.
    https://github.com/me-no-dev/ESPAsyncWebServer.git#2d2da07

; Lingkungan Uji Sensor DYP-A16 (Super Cepat dan Ringan)
[env:sensor-test]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_src_filter = -<*> +<../tools/sensor_test.cpp>

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
